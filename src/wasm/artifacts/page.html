<!doctype html>
<!-- page.html — web host: status bar + responsive board from GameSnapshot (#37). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sudoku</title>
  <style>
    :root {
      --page-bg: #16181d;
      --page-fg: #e6e6e6;
      --status-bg: #0e1013;
      --status-border: #333844;
      --status-fg: #e6e6e6;
      --status-error: #ff9b9b;
      --board-bg: #0e1013;
      --cell-bg: #16181d;
      --cell-fg: #e6e6e6;
      --given-fg: #a8b0c0;
      --player-fg: #f2f4f8;
      --conflict-fg: #ff8a8a;
      --conflict-bg: #3a1f24;
      --line-cell: #333844;
      --line-box: #5a6270;
      --selection-ring: #6ea8fe;
      --region-tint: rgba(110, 168, 254, 0.12);
      --cell-min: 2.25rem;
      --board-min: calc(var(--cell-min) * 9 + 2px);
      --board-size: clamp(
        var(--board-min),
        min(calc(100dvw - 2rem), calc(100dvh - 7rem)),
        100%
      );
      --status-min-height: calc(0.9375rem * 1.45 + 1.25rem);
    }

    [data-theme="light"] {
      --page-bg: #eef0f4;
      --page-fg: #1a1d24;
      --status-bg: #ffffff;
      --status-border: #c8ced8;
      --status-fg: #1a1d24;
      --status-error: #b42318;
      --board-bg: #ffffff;
      --cell-bg: #f8f9fb;
      --cell-fg: #1a1d24;
      --given-fg: #4a5568;
      --player-fg: #111827;
      --conflict-fg: #b42318;
      --conflict-bg: #fef2f2;
      --line-cell: #d0d5dd;
      --line-box: #667085;
      --selection-ring: #2563eb;
      --region-tint: rgba(37, 99, 235, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
    }

    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      min-height: 100dvh;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--page-bg);
      color: var(--page-fg);
    }

    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
    }

    #status-bar {
      width: min(100%, var(--board-size));
      min-height: var(--status-min-height);
      font-size: 0.9375rem;
      line-height: 1.45;
      padding: 0.625rem 0.75rem;
      border: 1px solid var(--status-border);
      border-radius: 6px;
      background: var(--status-bg);
      color: var(--status-fg);
    }

    #status-bar.error {
      color: var(--status-error);
    }

    #error-modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.45);
      z-index: 10;
    }

    #error-modal[hidden] {
      display: none;
    }

    .error-dialog {
      width: min(100%, 24rem);
      padding: 1rem 1.25rem;
      border: 1px solid var(--status-border);
      border-radius: 8px;
      background: var(--status-bg);
      color: var(--status-fg);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    }

    #error-modal-msg {
      margin: 0 0 1rem;
      line-height: 1.45;
    }

    #error-modal-dismiss {
      font: inherit;
      padding: 0.375rem 0.875rem;
      border: 1px solid var(--status-border);
      border-radius: 6px;
      background: var(--cell-bg);
      color: var(--status-fg);
      cursor: pointer;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(9, 1fr);
      container-type: size;
      width: var(--board-size);
      aspect-ratio: 1;
      border: 1px solid var(--line-box);
      background: var(--board-bg);
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
      font-size: clamp(0.75rem, 45cqmin, 2rem);
      font-weight: 500;
      background: var(--cell-bg);
      color: var(--cell-fg);
      border-right: 1px solid var(--line-cell);
      border-bottom: 1px solid var(--line-cell);
      user-select: none;
    }

    .cell:nth-child(9n) {
      border-right: none;
    }

    .cell:nth-child(n + 73) {
      border-bottom: none;
    }

    .cell.box-right {
      border-right: 1px solid var(--line-box);
    }

    .cell.box-bottom {
      border-bottom: 1px solid var(--line-box);
    }

    .cell:nth-child(9n).box-right {
      border-right: none;
    }

    .cell:nth-child(n + 73).box-bottom {
      border-bottom: none;
    }

    .cell.given {
      color: var(--given-fg);
      font-weight: 600;
    }

    .cell.player {
      color: var(--player-fg);
    }

    .cell.conflict {
      color: var(--conflict-fg);
      background: var(--conflict-bg);
    }

    .cell.selected {
      outline: 2px solid var(--selection-ring);
      outline-offset: -2px;
      z-index: 1;
    }

    .board:focus {
      outline: none;
    }
  </style>
</head>
<body>
  <main id="app">
    <div id="board" class="board" role="grid" aria-label="Sudoku board"></div>
    <div id="status-bar" role="status" aria-live="polite"></div>
  </main>

  <div id="error-modal" hidden role="alertdialog" aria-modal="true" aria-labelledby="error-modal-msg">
    <div class="error-dialog">
      <p id="error-modal-msg"></p>
      <button type="button" id="error-modal-dismiss">OK</button>
    </div>
  </div>

  <script type="module">
    import { loadArtifact } from "./glue.js";
    import { newGame, wireErrorModal } from "../shell.js";
    import { renderBoard, setStatus, wireSelection, wirePlayLoop } from "../board.js";

    const statusBar = document.getElementById("status-bar");
    const boardEl = document.getElementById("board");
    const errorModal = wireErrorModal(
      document.getElementById("error-modal"),
      document.getElementById("error-modal-msg"),
      document.getElementById("error-modal-dismiss"),
    );

    try {
      const res = await fetch("./artifact.wasm");
      if (!res.ok) throw new Error(`fetch failed: ${res.status} ${res.statusText}`);
      const bytes = new Uint8Array(await res.arrayBuffer());

      const game = await loadArtifact(bytes);
      const started = newGame(game, { difficulty: 1 });
      if (!started.ok) throw new Error(started.error ?? "init failed");

      renderBoard(boardEl, started.state);
      setStatus(statusBar, "");
      const selection = wireSelection(boardEl, { row: 0, col: 0 });
      wirePlayLoop(boardEl, game, selection, statusBar, errorModal, started.state, started.legend);
      boardEl.focus();
    } catch (err) {
      setStatus(statusBar, `failed to load wasm: ${err && err.message ? err.message : err}`, { error: true });
    }
  </script>
</body>
</html>
