<!doctype html>
<!-- page.html — web host stub after REPL retirement (#34).
     Structured DOM shell lands with #31; serve still delivers page + glue + wasm. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sudoku</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 1rem;
      background: #16181d;
      color: #e6e6e6;
    }
    #status {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px;
      line-height: 1.45;
      padding: 0.75rem;
      border: 1px solid #333844;
      border-radius: 6px;
      background: #0e1013;
    }
    .error { color: #ff9b9b; }
  </style>
</head>
<body>
  <main>
    <p id="status">loading…</p>
  </main>

  <script type="module">
    import { loadArtifact } from "./glue.js";

    const status = document.getElementById("status");

    try {
      const res = await fetch("./artifact.wasm");
      if (!res.ok) throw new Error(`fetch failed: ${res.status} ${res.statusText}`);
      const bytes = new Uint8Array(await res.arrayBuffer());

      const game = await loadArtifact(bytes);
      game.start();
      status.textContent = "Sudoku wasm loaded (structured API pending).";
    } catch (err) {
      status.textContent = `failed to load wasm: ${err && err.message ? err.message : err}`;
      status.classList.add("error");
    }
  </script>
</body>
</html>
