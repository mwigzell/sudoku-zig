<!doctype html>
<!-- page.html — web host stub using structured wasm JSON exports (#31). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sudoku</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 1rem;
      background: #16181d;
      color: #e6e6e6;
    }
    #status {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px;
      line-height: 1.45;
      padding: 0.75rem;
      border: 1px solid #333844;
      border-radius: 6px;
      background: #0e1013;
      white-space: pre-wrap;
    }
    .error { color: #ff9b9b; }
  </style>
</head>
<body>
  <main>
    <p id="status">loading…</p>
  </main>

  <script type="module">
    import { loadArtifact } from "./glue.js";
    import { newGame } from "../shell.js";

    const status = document.getElementById("status");

    try {
      const res = await fetch("./artifact.wasm");
      if (!res.ok) throw new Error(`fetch failed: ${res.status} ${res.statusText}`);
      const bytes = new Uint8Array(await res.arrayBuffer());

      const game = await loadArtifact(bytes);
      const started = newGame(game, { difficulty: 1 });
      if (!started.ok) throw new Error(started.error ?? "init failed");

      const legend = started.legend;
      const state = started.state;
      const filled = state.cells.filter((c) => c.value !== 0).length;
      status.textContent =
        `Sudoku wasm ready.\n` +
        `Legend: fill=${legend.fill} undo=${legend.undo} quit=${legend.quit}\n` +
        `Cells filled: ${filled}/81`;
    } catch (err) {
      status.textContent = `failed to load wasm: ${err && err.message ? err.message : err}`;
      status.classList.add("error");
    }
  </script>
</body>
</html>
