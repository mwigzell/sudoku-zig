<!doctype html>
<!-- page.html — web host: status bar + responsive board from GameSnapshot. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sudoku</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/branding/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/branding/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/branding/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <style>
    :root {
      --page-bg: #16181d;
      --page-fg: #e6e6e6;
      --status-bg: #0e1013;
      --status-border: #333844;
      --status-fg: #e6e6e6;
      --status-error: #ff9b9b;
      --board-bg: #0e1013;
      --gutter-bg: #0a0c0f;
      --label-fg: #8b939e;
      --frame-border: #5a6270;
      --cell-bg: #16181d;
      --cell-fg: #e6e6e6;
      --given-fg: #a8b0c0;
      --player-fg: #f2f4f8;
      --conflict-fg: #ff8a8a;
      --conflict-bg: #3a1f24;
      --line-cell: #333844;
      --line-box: #5a6270;
      --selection-ring: #6ea8fe;
      --region-tint: rgba(110, 168, 254, 0.12);
      --cell-min: 2.25rem;
      --board-min: calc(var(--cell-min) * 10 + 2px);
      --status-min-height: calc(0.9375rem * 1.45 + 1.25rem);
      --page-inset: 1rem;
      --game-margin: 0.75rem;
      --menu-block: 2.75rem;
      --v-chrome: calc(
        (2 * var(--page-inset))
        + (2 * var(--game-margin))
        + var(--status-min-height)
        + var(--menu-block)
        + 1.5rem
      );
      --board-size: clamp(
        var(--board-min),
        min(
          calc(100dvw - (2 * var(--page-inset)) - (2 * var(--game-margin))),
          calc(100dvh - var(--v-chrome))
        ),
        100%
      );
      --chrome-rule: 1px solid var(--status-border);
    }

    [data-theme="light"] {
      --page-bg: #eef0f4;
      --page-fg: #1a1d24;
      --status-bg: #ffffff;
      --status-border: #c8ced8;
      --status-fg: #1a1d24;
      --status-error: #b42318;
      --board-bg: #ffffff;
      --gutter-bg: #eef0f4;
      --label-fg: rgb(102, 112, 133);
      --frame-border: rgb(102, 112, 133);
      --cell-bg: #f8f9fb;
      --cell-fg: #1a1d24;
      --given-fg: #4a5568;
      --player-fg: #111827;
      --conflict-fg: #b42318;
      --conflict-bg: #fef2f2;
      --line-cell: #d0d5dd;
      --line-box: #667085;
      --selection-ring: #2563eb;
      --region-tint: rgba(37, 99, 235, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
    }

    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      min-height: 100dvh;
      padding: var(--page-inset);
      padding-bottom: max(var(--page-inset), env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--page-bg);
      color: var(--page-fg);
    }

    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      flex: 0 1 auto;
    }

    #game-shell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      width: min(100%, calc(var(--board-size) + (2 * var(--game-margin))));
      padding: var(--game-margin);
      margin-bottom: max(var(--game-margin), env(safe-area-inset-bottom, 0px));
      box-sizing: border-box;
    }

    #menu-bar {
      display: flex;
      flex-wrap: nowrap;
      align-items: stretch;
      gap: 0;
      width: min(100%, var(--board-size));
      padding: 0;
      border-bottom: var(--chrome-rule);
    }

    #current-file-desktop {
      margin-left: auto;
      align-self: center;
  display: block;
      flex: 1 1 8ch;
      min-width: 8ch;
  text-align: right;
  overflow: hidden;
  text-overflow: ellipsis;
      padding: 0 0.75rem;
      font-size: 0.8125rem;
      opacity: 0.85;
      white-space: nowrap;
    }

    .menu {
      position: relative;
  flex: 0 0 auto;
    }

    .menu-trigger {
      font: inherit;
      padding: 0.5rem 0.875rem;
      border: none;
      border-radius: 0;
      background: transparent;
      color: var(--status-fg);
      cursor: pointer;
    }

    .menu-trigger:hover,
    .menu[data-open="true"] .menu-trigger {
      background: var(--cell-bg);
    }

    .menu-panel {
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      min-width: 10rem;
      margin: 0;
      padding: 0.25rem 0;
      border: 1px solid var(--status-border);
      border-radius: 6px;
      background: var(--status-bg);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .menu-panel[hidden] {
      display: none !important;
    }

    .menu-panel button {
      font: inherit;
      width: 100%;
      padding: 0.5rem 0.875rem;
      border: none;
      border-radius: 0;
      background: transparent;
      color: var(--status-fg);
      text-align: left;
      cursor: pointer;
    }

    .menu-panel button:hover:not(:disabled) {
      background: var(--cell-bg);
    }

    .menu-panel button.selected,
    .menu-panel button[aria-checked="true"] {
      background: var(--cell-bg);
      font-weight: 600;
    }

    .menu-panel button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    #status-bar {
      width: min(100%, var(--board-size));
      min-height: var(--status-min-height);
      font-size: 0.9375rem;
      line-height: 1.45;
      padding: 0.625rem 0.75rem;
      margin-top: 0.35rem;
      border: 1px solid var(--status-border);
      border-bottom: var(--chrome-rule);
      border-radius: 6px;
      background: var(--status-bg);
      color: var(--status-fg);
    }

    #play-pad {
      width: min(100%, var(--board-size));
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0.35rem;
      margin-top: 0.35rem;
      margin-bottom: max(0.85rem, env(safe-area-inset-bottom, 0px));
    }
    #play-pad[hidden] {
      display: none !important;
    }

    .play-pad-btn {
      font: inherit;
      font-size: 1rem;
      line-height: 1.2;
      padding: 0.45rem 0.2rem;
      border: 1px solid var(--status-border);
      border-radius: 6px;
      background: var(--cell-bg);
      color: var(--status-fg);
      touch-action: manipulation;
    }

    #status-bar.error {
      color: var(--status-error);
    }

    #status-bar.generating {
      animation: status-generating-pulse 1.2s ease-in-out infinite;
    }

    @keyframes status-generating-pulse {
      50% {
        opacity: 0.55;
      }
    }

    #error-modal,
    #replace-confirm-modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.45);
      z-index: 10;
    }

    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 1rem;
      background: var(--page-bg);
      color: var(--page-fg);
      text-align: center;
    }

    #boot-splash[hidden] {
      display: none;
    }

    #boot-splash-logo {
      width: min(14rem, 62vw);
      max-height: 34dvh;
      height: auto;
      image-rendering: auto;
      object-fit: contain;
    }

    #boot-splash-msg {
      margin: 0;
      opacity: 0.9;
      font-size: 0.9375rem;
    }

    #error-modal[hidden],
    #replace-confirm-modal[hidden],
    #about-modal[hidden],
    #settings-modal[hidden],
    #new-difficulty-modal[hidden],
    #generating-modal[hidden] {
      display: none;
    }

    #generating-modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.45);
      z-index: 11;
    }

    .generating-dialog {
      width: min(100%, 24rem);
      padding: 1rem 1.25rem;
      border: 1px solid var(--status-border);
      border-radius: 8px;
      background: var(--status-bg);
      color: var(--status-fg);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    #generating-spinner {
      width: 2.5rem;
      height: 2.5rem;
      margin: 0.75rem auto 1rem;
      border: 3px solid var(--status-border);
      border-top-color: var(--status-fg);
      border-radius: 50%;
      animation: generating-spin 0.9s linear infinite;
    }

    @keyframes generating-spin {
      to {
        transform: rotate(360deg);
      }
    }

    #generating-progress-rows {
      display: none;
      text-align: left;
      font-size: 0.875rem;
      line-height: 1.45;
      margin: 0 0 1rem;
      /* Hint + up to four row lines — limits height jump as rows appear/disappear */
      min-height: calc(0.75rem * 1.45 + 4 * 0.875rem * 1.45);
    }

    #generating-spinner[hidden] {
      height: 0;
      width: 0;
      margin: 0;
      border-width: 0;
      overflow: hidden;
      animation: none;
    }

    .gen-progress-row[hidden] {
      display: none;
    }

    .gen-progress-attempt-hint {
      font-size: 0.75rem;
      color: var(--label-fg);
      margin: 0.15rem 0 0.35rem 0.15rem;
    }

    .gen-progress-attempt-hint[hidden] {
      display: none;
    }

    #generating-modal-continue:disabled,
    #generating-modal-cancel:disabled {
      opacity: 0.45;
      cursor: default;
    }

    #generating-modal-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-top: 0.75rem;
    }

    #about-modal,
    #settings-modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.45);
      z-index: 10;
    }

    #new-difficulty-modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.45);
      z-index: 10;
    }

    .new-difficulty-btn {
      display: block;
      width: 100%;
      margin: 0.25rem 0;
      font: inherit;
      padding: 0.375rem 0.875rem;
      border: 1px solid var(--status-border);
      border-radius: 6px;
      background: var(--cell-bg);
      color: var(--status-fg);
      cursor: pointer;
    }

    .error-dialog,
    .about-dialog {
      width: min(100%, 24rem);
      padding: 1rem 1.25rem;
      border: 1px solid var(--status-border);
      border-radius: 8px;
      background: var(--status-bg);
      color: var(--status-fg);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    }

    .about-dialog {
      text-align: center;
    }

    .settings-dialog {
      width: min(100%, 28rem);
      padding: 1rem 1.25rem;
      border: 1px solid var(--status-border);
      border-radius: 8px;
      background: var(--status-bg);
      color: var(--status-fg);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      text-align: left;
    }

    #error-modal-msg {
      margin: 0 0 1rem;
      line-height: 1.45;
    }
    #replace-confirm-msg {
      margin: 0 0 1rem;
      line-height: 1.45;
    }
    #replace-confirm-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    #about-artwork {
      width: 4.5rem;
      height: 4.5rem;
      object-fit: contain;
      display: block;
      margin: 0 auto 0.5rem;
    }

    #about-modal-title {
      margin: 0 0 0.5rem;
      font-size: 1.125rem;
    }

    #about-summary,
    #about-copyright {
      margin: 0 0 0.5rem;
      line-height: 1.45;
    }

    #about-summary {
      white-space: pre-line;
    }

    #settings-modal label {
      display: block;
      margin: 0 0 0.875rem;
      line-height: 1.45;
    }

    #settings-warn-solvability-label {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      cursor: pointer;
    }

    #settings-auto-restore-label,
    #settings-auto-new-label,
    #settings-auto-save-label {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      cursor: pointer;
    }

    #settings-difficulty-label select,
    #settings-log-level-label select {
      display: block;
      margin-top: 0.35rem;
      width: 100%;
      font: inherit;
      padding: 0.25rem 0.5rem;
      border: 1px solid var(--status-border);
      border-radius: 6px;
      background: var(--cell-bg);
      color: var(--status-fg);
    }

    #settings-modal-dismiss,
    #about-modal-dismiss,
    #error-modal-dismiss,
    #replace-confirm-cancel,
    #replace-confirm-ok,
    #new-difficulty-cancel,
    #generating-modal-cancel,
    #generating-modal-continue {
      font: inherit;
      padding: 0.375rem 0.875rem;
      border: 1px solid var(--status-border);
      border-radius: 6px;
      background: var(--cell-bg);
      color: var(--status-fg);
      cursor: pointer;
    }

    #settings-modal-dismiss,
    #about-modal-dismiss,
    #error-modal-dismiss,
    #replace-confirm-cancel,
    #new-difficulty-cancel {
      display: block;
      margin: 0.5rem 0 0 auto;
    }

    .board-frame {
      display: grid;
      grid-template-columns: 1fr repeat(9, 2fr) 1fr;
      grid-template-rows: 1fr repeat(9, 2fr) 1fr;
      width: var(--board-size);
      aspect-ratio: 1;
      border: 1px solid var(--frame-border);
      background: var(--gutter-bg);
    }

    .gutter-cell,
    .label-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
      background: var(--gutter-bg);
      user-select: none;
      border: none;
    }

    .label-cell {
      color: var(--label-fg);
      font-size: clamp(0.625rem, 28cqmin, 0.875rem);
      font-weight: 600;
    }

    .board-play {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(9, 1fr);
      grid-column: 2 / 11;
      grid-row: 2 / 11;
      container-type: size;
      background: var(--board-bg);
      border: 1px solid var(--line-box);
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
      font-size: clamp(0.75rem, 45cqmin, 2rem);
      font-weight: 500;
      background: var(--cell-bg);
      color: var(--cell-fg);
      border-right: 1px solid var(--line-cell);
      border-bottom: 1px solid var(--line-cell);
      user-select: none;
    }

    .cell:nth-child(9n) {
      border-right: none;
    }

    .cell:nth-child(n + 73) {
      border-bottom: none;
    }

    .cell.box-right {
      border-right: 1px solid var(--line-box);
    }

    .cell.box-bottom {
      border-bottom: 1px solid var(--line-box);
    }

    .cell:nth-child(9n).box-right {
      border-right: none;
    }

    .cell:nth-child(n + 73).box-bottom {
      border-bottom: none;
    }

    .cell.given {
      color: var(--given-fg);
      font-weight: 600;
    }

    .cell.player {
      color: var(--player-fg);
    }

    .cell.conflict {
      color: var(--conflict-fg);
      background: var(--conflict-bg);
    }

    .cell.region:not(.conflict) {
      box-shadow: inset 0 0 0 9999px var(--region-tint);
    }

    .cell.selected {
      outline: 2px solid var(--selection-ring);
      outline-offset: -2px;
      z-index: 1;
    }

    .board-play:focus {
      outline: none;
    }

    /* Group-fit trigger: switch when the default menu+board+status stack can no longer
       fit at minimum board size plus default outer/shell spacing. */
    @media (max-width: calc(26rem + 2px)) {
      :root {
        --page-inset: 0;
        --game-margin: 0;
        --board-size: 100dvw;
      }

      body {
        padding: 0;
        justify-content: flex-start;
      }

      #app {
        width: 100%;
        min-height: 100dvh;
        align-items: stretch;
        gap: 0.25rem;
      }

      #game-shell {
        width: 100%;
        flex: 1 1 auto;
        align-items: stretch;
        justify-content: flex-start;
        gap: 0.25rem;
        padding: 0;
      }

      #menu-bar {
        width: 100%;
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 9;
      }

      .menu-trigger {
        padding: 0.45rem 0.55rem;
      }


      .board-frame {
        width: 100dvw;
      }

      #status-bar {
        width: 100dvw;
        border-left: none;
        border-right: none;
        border-radius: 0;
      }

      #play-pad {
        margin-top: auto;
      }

    }
  </style>
</head>
<body>
  <div id="boot-splash" role="status" aria-live="polite">
    <img id="boot-splash-logo" src="/branding/splash-mark-256.png" alt="Sudoku gator mark">
    <p id="boot-splash-msg">Loading sudoku-zig…</p>
  </div>
  <main id="app">
    <nav id="menu-bar" role="menubar" aria-label="Application menu">
      <div class="menu" data-menu="file">
        <button type="button" class="menu-trigger" role="menuitem" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-file-panel">File</button>
        <div class="menu-panel" id="menu-file-panel" role="menu" hidden>
          <button type="button" role="menuitem" id="file-new">New</button>
          <button type="button" role="menuitem" id="file-open">Open</button>
          <button type="button" role="menuitem" id="file-import">Import</button>
          <button type="button" role="menuitem" id="file-export">Export</button>
          <button type="button" role="menuitem" id="file-save">Save</button>
          <button type="button" role="menuitem" id="file-save-as">Save As</button>
          <button type="button" role="menuitemcheckbox" id="file-auto-save" aria-checked="false">Auto Save (Off)</button>
          <button type="button" role="menuitem" id="file-settings">Settings</button>
        </div>
      </div>
      <div class="menu" data-menu="edit">
        <button type="button" class="menu-trigger" role="menuitem" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-edit-panel">Edit</button>
        <div class="menu-panel" id="menu-edit-panel" role="menu" hidden>
          <button type="button" role="menuitem" id="edit-undo" disabled>Undo</button>
          <button type="button" role="menuitem" id="edit-redo" disabled>Redo</button>
          <button type="button" role="menuitem" id="edit-copy" disabled>Copy</button>
          <button type="button" role="menuitem" id="edit-paste" disabled>Paste</button>
          <button type="button" role="menuitem" id="edit-solve" disabled>Solve</button>
          <button type="button" role="menuitem" id="edit-hint">Hint</button>
          <button type="button" role="menuitem" id="edit-deselect" disabled aria-keyshortcuts="Escape">Deselect Cell</button>
        </div>
      </div>
      <div class="menu" data-menu="view">
        <button type="button" class="menu-trigger" role="menuitem" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-view-panel">View</button>
        <div class="menu-panel" id="menu-view-panel" role="menu" hidden>
          <button type="button" role="menuitemradio" id="view-light" aria-checked="false">Light</button>
          <button type="button" role="menuitemradio" id="view-dark" aria-checked="true">Dark</button>
          <button type="button" role="menuitemcheckbox" id="view-region" aria-checked="false">Show Region</button>
        </div>
      </div>
      <div class="menu" data-menu="help">
        <button type="button" class="menu-trigger" role="menuitem" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-help-panel">Help</button>
        <div class="menu-panel" id="menu-help-panel" role="menu" hidden>
          <button type="button" role="menuitem" id="help-about">About</button>
        </div>
      </div>
      <span id="current-file-desktop" aria-live="polite"></span>
    </nav>
    <div id="game-shell">
      <div id="board" class="board-frame"></div>
      <div id="status-bar" role="status" aria-live="polite"></div>
      <div id="play-pad" role="group" aria-label="Cell input controls" hidden>
        <button type="button" class="play-pad-btn" data-play-key="1">1</button>
        <button type="button" class="play-pad-btn" data-play-key="2">2</button>
        <button type="button" class="play-pad-btn" data-play-key="3">3</button>
        <button type="button" class="play-pad-btn" data-play-key="4">4</button>
        <button type="button" class="play-pad-btn" data-play-key="5">5</button>
        <button type="button" class="play-pad-btn" data-play-key="6">6</button>
        <button type="button" class="play-pad-btn" data-play-key="7">7</button>
        <button type="button" class="play-pad-btn" data-play-key="8">8</button>
        <button type="button" class="play-pad-btn" data-play-key="9">9</button>
        <button type="button" class="play-pad-btn" data-play-key="0" aria-label="Clear selected cell">Clear</button>
      </div>
    </div>
  </main>

  <div id="error-modal" hidden role="alertdialog" aria-modal="true" aria-labelledby="error-modal-msg">
    <div class="error-dialog">
      <p id="error-modal-msg"></p>
      <button type="button" id="error-modal-dismiss">OK</button>
    </div>
  </div>
  <div id="replace-confirm-modal" hidden role="alertdialog" aria-modal="true" aria-labelledby="replace-confirm-msg">
    <div class="error-dialog">
      <p id="replace-confirm-msg"></p>
      <div id="replace-confirm-actions">
        <button type="button" id="replace-confirm-cancel">Cancel</button>
        <button type="button" id="replace-confirm-ok">Replace</button>
      </div>
    </div>
  </div>

  <div id="settings-modal" hidden role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
    <div class="settings-dialog">
      <h2 id="settings-modal-title">Settings</h2>
      <label id="settings-warn-solvability-label">
        <input type="checkbox" id="settings-warn-solvability" />
        Warn when the puzzle has no solution
      </label>
      <label id="settings-difficulty-label">
        Default difficulty
        <select id="settings-difficulty">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </label>
      <label id="settings-log-level-label">
        Log level
        <select id="settings-log-level">
          <option value="debug">Debug</option>
          <option value="info">Info</option>
          <option value="warn">Warn</option>
          <option value="err">Error</option>
          <option value="fatal">Fatal</option>
        </select>
      </label>
      <label id="settings-auto-restore-label">
        <input type="checkbox" id="settings-auto-restore" />
        Auto restore current file on startup
      </label>
      <label id="settings-auto-new-label">
        <input type="checkbox" id="settings-auto-new" />
        Auto start new game when restore is unavailable
      </label>
      <label id="settings-auto-save-label">
        <input type="checkbox" id="settings-auto-save" />
        Auto save after changes
      </label>
      <button type="button" id="settings-modal-dismiss">OK</button>
    </div>
  </div>

  <div id="about-modal" hidden role="dialog" aria-modal="true" aria-labelledby="about-modal-title">
    <div class="about-dialog">
      <img id="about-artwork" src="/branding/about-variant-96.png" alt="Sudoku gator artwork variant">
      <h2 id="about-modal-title"></h2>
      <p id="about-summary"></p>
      <p id="about-copyright"></p>
      <button type="button" id="about-modal-dismiss">OK</button>
    </div>
  </div>

  <div id="generating-modal" hidden role="dialog" aria-modal="true" aria-labelledby="generating-modal-title">
    <div class="generating-dialog">
      <h2 id="generating-modal-title">New game</h2>
      <div id="generating-spinner" aria-hidden="true"></div>
      <p id="generating-modal-msg">Generating…</p>
      <div id="generating-progress-rows" aria-live="polite"></div>
      <div id="generating-modal-actions">
        <button type="button" id="generating-modal-cancel" disabled>Cancel</button>
        <button type="button" id="generating-modal-continue" disabled>Continue</button>
      </div>
    </div>
  </div>

  <div id="new-difficulty-modal" hidden role="dialog" aria-modal="true" aria-labelledby="new-difficulty-title">
    <div class="about-dialog">
      <h2 id="new-difficulty-title">New game</h2>
      <p id="new-difficulty-prompt">Choose a difficulty:</p>
      <button type="button" class="new-difficulty-btn" data-difficulty="1">Easy</button>
      <button type="button" class="new-difficulty-btn" data-difficulty="2">Medium</button>
      <button type="button" class="new-difficulty-btn" data-difficulty="3">Hard</button>
      <button type="button" id="new-difficulty-cancel">Cancel</button>
    </div>
  </div>

  <script>
    (function () {
      const statusBar = document.getElementById("status-bar");
      const errorModal = document.getElementById("error-modal");
      const errorMsg = document.getElementById("error-modal-msg");
      const bootSplash = document.getElementById("boot-splash");
      const isAndroidWebView =
        typeof window !== "undefined" &&
        (!!window.__SudokuAndroidBridge ||
          /\bwv\b/.test(navigator.userAgent) ||
          /Android/i.test(navigator.userAgent));
      const bootSplashShownAt =
        typeof performance !== "undefined" && typeof performance.now === "function"
          ? performance.now()
          : Date.now();
      const BOOT_SPLASH_MIN_MS = 2000;
      const WEB_BOOT_TIMEOUT_MS = 12000;
      let bootSplashHidePromise = null;
      let bootTimedOut = false;
      const dismiss = document.getElementById("error-modal-dismiss");
      dismiss?.addEventListener("click", () => {
        if (errorModal) errorModal.hidden = true;
      });
      async function hideBootSplash() {
        if (bootSplashHidePromise) return bootSplashHidePromise;
        bootSplashHidePromise = (async () => {
          if (isAndroidWebView) {
            if (bootSplash) bootSplash.hidden = true;
            return;
          }
          const now =
            typeof performance !== "undefined" && typeof performance.now === "function"
              ? performance.now()
              : Date.now();
          const remaining = Math.max(0, BOOT_SPLASH_MIN_MS - (now - bootSplashShownAt));
          if (remaining > 0) await new Promise((resolve) => setTimeout(resolve, remaining));
          if (bootSplash) bootSplash.hidden = true;
        })();
        return bootSplashHidePromise;
      }
      function showBootFailure(message) {
        if (bootTimedOut && message === "web startup timed out") return;
        void hideBootSplash();
        if (statusBar) {
          statusBar.textContent = message;
          statusBar.className = "error";
        }
        if (errorModal && errorMsg) {
          errorMsg.textContent = message;
          errorModal.hidden = false;
        }
      }
      window.addEventListener("error", (ev) => {
        if (ev.message) showBootFailure(String(ev.message));
      });
      window.addEventListener("unhandledrejection", (ev) => {
        const r = ev.reason;
        const msg = r && r.message ? r.message : String(r ?? "load failed");
        showBootFailure(msg);
      });
      window.__sudokuSignalAndroidBootReady = function () {
        window.__sudokuBootReady = true;
        try {
          if (
            window.__SudokuAndroidBridge &&
            typeof window.__SudokuAndroidBridge.notifyWebBootReady === "function"
          ) {
            window.__SudokuAndroidBridge.notifyWebBootReady();
          }
        } catch (_) {}
        try {
          if (window.AndroidFileBridge && typeof window.AndroidFileBridge.notifyWebBootReady === "function") {
            window.AndroidFileBridge.notifyWebBootReady();
          }
        } catch (_) {}
      };
      if (isAndroidWebView && bootSplash) bootSplash.hidden = true;
      setTimeout(() => {
        if (window.__sudokuBootReady === true) return;
        bootTimedOut = true;
        showBootFailure("web startup timed out");
      }, WEB_BOOT_TIMEOUT_MS);
      window.__hideSudokuBootSplash = hideBootSplash;
    })();
  </script>

  <script type="module">
    import { loadArtifact } from "./glue.js";
    import {
      applyEventStatus,
      canUseGenWorker,
      syncCurrentFileLabels,
      initializeWebSession,
      offerInitialNewGame,
      persistHostSettings,
      startupWriteContextEvent,
      eventToWriteContext,
      postWriteContextEvent,
      showErrorModal,
      wireErrorModal,
    } from "../shell.js";
    import { wireGeneratingModal } from "../generating.js";
    import { wireHelpAbout, wireAboutModal } from "../help.js";
    import { wireSettingsMenu } from "../settings.js";
    import { renderBoard, getPlayGrid, setStatus, wireSelection, wirePlayLoop } from "../board.js";
    import { wireEditMenu } from "../menu.js";
    import { collectMenuBarControls, wireMenuBar } from "../menu_bar.js";
    import { primeWebBootChrome, wireThemeMenu } from "../theme.js";
    import { wireFileMenu } from "../file_menu.js";
    import { wireRegionMenu } from "../region.js";

    const statusBar = document.getElementById("status-bar");
    const boardEl = document.getElementById("board");
    const playPadEl = document.getElementById("play-pad");
    const menuControls = collectMenuBarControls(document);
    const errorModal = wireErrorModal(
      document.getElementById("error-modal"),
      document.getElementById("error-modal-msg"),
      document.getElementById("error-modal-dismiss"),
    );
    const replaceConfirmModal = {
      el: document.getElementById("replace-confirm-modal"),
      msgEl: document.getElementById("replace-confirm-msg"),
      cancelBtn: document.getElementById("replace-confirm-cancel"),
      okBtn: document.getElementById("replace-confirm-ok"),
    };
    globalThis.__sudokuConfirmReplace = (message) =>
      new Promise((resolve) => {
        replaceConfirmModal.msgEl.textContent = message;
        replaceConfirmModal.el.hidden = false;
        const cleanup = () => {
          replaceConfirmModal.okBtn.removeEventListener("click", onOk);
          replaceConfirmModal.cancelBtn.removeEventListener("click", onCancel);
        };
        const onOk = () => {
          cleanup();
          replaceConfirmModal.el.hidden = true;
          resolve(true);
        };
        const onCancel = () => {
          cleanup();
          replaceConfirmModal.el.hidden = true;
          resolve(false);
        };
        replaceConfirmModal.okBtn.addEventListener("click", onOk);
        replaceConfirmModal.cancelBtn.addEventListener("click", onCancel);
      });
    const aboutModal = {
      el: document.getElementById("about-modal"),
      titleEl: document.getElementById("about-modal-title"),
      summaryEl: document.getElementById("about-summary"),
      copyrightEl: document.getElementById("about-copyright"),
    };
    wireAboutModal(aboutModal.el, document.getElementById("about-modal-dismiss"));
    const settingsModal = {
      el: document.getElementById("settings-modal"),
      checkbox: document.getElementById("settings-warn-solvability"),
      difficultySelect: document.getElementById("settings-difficulty"),
      logLevelSelect: document.getElementById("settings-log-level"),
      autoRestoreCheckbox: document.getElementById("settings-auto-restore"),
      autoNewCheckbox: document.getElementById("settings-auto-new"),
      autoSaveCheckbox: document.getElementById("settings-auto-save"),
      dismissEl: document.getElementById("settings-modal-dismiss"),
    };

    try {
      console.log("boot: module start");
      // Let the splash paint before kicking off wasm/network work.
      await new Promise((resolve) => requestAnimationFrame(resolve));
      console.log("boot: after first paint");
      const res = await fetch("./artifact.wasm");
      console.log("boot: artifact fetch response", res.status);
      if (!res.ok) throw new Error(`fetch failed: ${res.status} ${res.statusText}`);
      const bytes = new Uint8Array(await res.arrayBuffer());
      console.log("boot: artifact bytes", bytes.length);

      const game = await loadArtifact(bytes);
      console.log("boot: wasm loaded");
      const generatingModal = wireGeneratingModal({
        el: document.getElementById("generating-modal"),
        continueBtn: document.getElementById("generating-modal-continue"),
        cancelBtn: document.getElementById("generating-modal-cancel"),
        spinnerEl: document.getElementById("generating-spinner"),
        msgEl: document.getElementById("generating-modal-msg"),
        progressRowsEl: document.getElementById("generating-progress-rows"),
      });
      const genWorker = canUseGenWorker()
        ? { workerUrl: new URL("./gen_worker.js", import.meta.url).href, wasmBytes: bytes }
        : undefined;

      const boot = await initializeWebSession(game);
      console.log("boot: host config loaded");
      if (!boot.ok) throw new Error(boot.error ?? "session init failed");
      primeWebBootChrome(boot, document);

      const ready = await offerInitialNewGame(game, boot, generatingModal, {
        genWorker,
        startupAutoContinue: true,
      });
      console.log("boot: startup action complete", ready.kind);
      if (!ready.ok) throw new Error(ready.error ?? "New game failed");

      const session = {
        state: ready.state,
        legend: ready.legend,
        config: ready.config,
        default_save_filename: ready.default_save_filename,
        write_context: eventToWriteContext(startupWriteContextEvent(ready.kind)),
        writeContextEvent: postWriteContextEvent,
      };
      void postWriteContextEvent(startupWriteContextEvent(ready.kind));
      syncCurrentFileLabels(session);
      renderBoard(boardEl, session.state);
      if ((ready.kind === "new" || ready.kind === "empty") && ready.msg) {
        applyEventStatus(statusBar, { ok: true, msg: ready.msg });
      } else {
        setStatus(statusBar, "");
      }
      const menuBar = wireMenuBar(menuControls, session, document);
      const syncPlayPadVisibility = (sel) => {
        if (!playPadEl) return;
        playPadEl.hidden = sel == null;
      };
      syncPlayPadVisibility(null);
      const persistViewSettings = async (cfg) => {
        try {
          await persistHostSettings(cfg);
        } catch (err) {
          showErrorModal(errorModal, err?.message ?? String(err));
        }
      };
      const themeMenu = wireThemeMenu(menuControls, game, session, {
        root: document,
        statusEl: statusBar,
        onChange: () => menuBar.sync(),
        onPersist: persistViewSettings,
      });
      let editMenu;
      const selection = wireSelection(boardEl, {
        regionEnabled: () => session.config.show_region === true,
        onSelect: (sel) => {
          syncPlayPadVisibility(sel);
          editMenu?.sync();
        },
      });
      syncPlayPadVisibility(selection.getSelection());
      const regionMenu = wireRegionMenu(
        menuControls,
        game,
        session,
        boardEl,
        () => selection.getSelection(),
        { onChange: () => menuBar.sync(), onPersist: persistViewSettings, statusEl: statusBar },
      );
      const difficultyDialog = {
        el: document.getElementById("new-difficulty-modal"),
        buttons: [...document.querySelectorAll(".new-difficulty-btn")].map((btn) => ({
          label: btn.textContent,
          difficulty: Number(btn.dataset.difficulty),
          el: btn,
        })),
        cancelBtn: document.getElementById("new-difficulty-cancel"),
      };
      wireFileMenu(menuControls, game, boardEl, selection, statusBar, errorModal, session, menuBar, {
        difficultyDialog,
        generatingModal,
        genWorker,
        onViewRefresh: () => {
          themeMenu.sync();
          regionMenu.sync();
        },
        onPersist: persistViewSettings,
      });
      editMenu = wireEditMenu(
        menuControls.undo,
        menuControls.redo,
        menuControls.deselect,
        game,
        boardEl,
        selection,
        statusBar,
        errorModal,
        session,
        undefined,
        document,
        {
          syncLegend: () => menuBar.sync(),
          copyBtn: menuControls.copy,
          pasteBtn: menuControls.paste,
        },
      );
      wirePlayLoop(boardEl, game, selection, statusBar, errorModal, session, {
        onLegendChange: () => menuBar.sync(),
        playPadEl,
      });
      wireHelpAbout(menuControls.about, game, aboutModal);
      wireSettingsMenu(menuControls.settings, game, session, settingsModal, {
        closeMenus: () => menuBar.closeAll?.(),
        onPersist: persistViewSettings,
      });
      await globalThis.__hideSudokuBootSplash?.();
      globalThis.__sudokuSignalAndroidBootReady?.();
      console.log("boot: ready");
      if (globalThis.matchMedia?.("(pointer: fine)")?.matches === true) {
        getPlayGrid(boardEl).focus();
      }
    } catch (err) {
      console.error("boot: failed", err);
      await globalThis.__hideSudokuBootSplash?.();
      globalThis.__sudokuSignalAndroidBootReady?.();
      const msg = `failed to load wasm: ${err && err.message ? err.message : err}`;
      setStatus(statusBar, msg, { error: true });
      showErrorModal(errorModal, msg);
    }
  </script>
</body>
</html>
