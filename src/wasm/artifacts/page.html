<!doctype html>
<!-- page.html — web host: status bar + responsive board from GameSnapshot. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sudoku</title>
  <script src="/android_bridge.js"></script>
  <link rel="icon" type="image/png" sizes="32x32" href="/branding/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/branding/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/branding/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <style>
    :root {
      --page-bg: #16181d;
      --page-fg: #e6e6e6;
      --status-bg: #0e1013;
      --status-border: #333844;
      --status-fg: #e6e6e6;
      --status-error: #ff9b9b;
      --board-bg: #0e1013;
      --gutter-bg: #0a0c0f;
      --label-fg: #8b939e;
      --frame-border: #5a6270;
      --cell-bg: #16181d;
      --cell-fg: #e6e6e6;
      --given-bg: rgb(16 19 23);
      --given-fg: #a8b0c0;
      --player-fg: #f2f4f8;
      --conflict-fg: #ff8a8a;
      --conflict-bg: #3a1f24;
      --overlay-bg: rgb(27 32 40);
      --overlay-border: rgb(86 97 113);
      --overlay-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      --line-cell: #333844;
      --line-box: #5a6270;
      --selection-ring: #6ea8fe;
      --region-tint: rgba(110, 168, 254, 0.12);
      --badge-error-bg: #e5484d;
      --badge-warning-bg: #f5c518;
      --badge-info-bg: #3b82f6;
      --badge-fg: #ffffff;
      --badge-warning-fg: #1a1d24;
      --cell-min: 2.25rem;
      --board-min: calc(var(--cell-min) * 10 + 2px);
      --status-pad-y: 0.625rem;
      --status-min-height: calc(0.9375rem * 1.45 + (2 * var(--status-pad-y)));
      --pad-bottom: 0.85rem;
      --page-inset: 1rem;
      --game-margin: 0.75rem;
      --menu-block: 2.75rem;
      --pad-gap: 0.35rem;
      --pad-row: calc(1rem * 1.2 + 0.9rem + 2px);
      --pad-block: calc((3 * var(--pad-row)) + (3 * var(--pad-gap)) + var(--pad-bottom));
      --v-chrome: calc(
        (2 * var(--page-inset))
        + (2 * var(--game-margin))
        + var(--status-min-height)
        + var(--menu-block)
        + var(--pad-block)
        + 1.5rem
      );
      --board-size: clamp(
        var(--board-min),
        min(
          calc(100dvw - (2 * var(--page-inset)) - (2 * var(--game-margin))),
          calc(100dvh - var(--v-chrome))
        ),
        100%
      );
      --chrome-rule: 1px solid var(--status-border);
    }

    [data-theme="light"] {
      --page-bg: #eef0f4;
      --page-fg: #1a1d24;
      --status-bg: #ffffff;
      --status-border: #c8ced8;
      --status-fg: #1a1d24;
      --status-error: #b42318;
      --board-bg: #ffffff;
      --gutter-bg: #eef0f4;
      --label-fg: rgb(102, 112, 133);
      --frame-border: rgb(102, 112, 133);
      --cell-bg: #f8f9fb;
      --cell-fg: #1a1d24;
      --given-bg: rgb(233 237 243);
      --given-fg: #4a5568;
      --player-fg: #111827;
      --conflict-fg: #b42318;
      --conflict-bg: #fef2f2;
      --overlay-bg: rgb(244 247 252);
      --overlay-border: rgb(141 155 176);
      --overlay-shadow: 0 14px 40px rgba(17, 24, 39, 0.2);
      --line-cell: #d0d5dd;
      --line-box: #667085;
      --selection-ring: #2563eb;
      --region-tint: rgba(37, 99, 235, 0.1);
      --badge-error-bg: #d92d20;
      --badge-warning-bg: #f2b705;
      --badge-info-bg: rgb(37 99 235);
    }

    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
    }

    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      min-height: 100dvh;
      padding: var(--page-inset);
      padding-bottom: max(var(--page-inset), env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--page-bg);
      color: var(--page-fg);
    }

    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      flex: 0 1 auto;
    }

    #game-shell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      width: min(100%, calc(var(--board-size) + (2 * var(--game-margin))));
      padding: var(--game-margin);
      margin-bottom: max(var(--game-margin), env(safe-area-inset-bottom, 0px));
      box-sizing: border-box;
    }

    #menu-bar {
      display: flex;
      flex-wrap: nowrap;
      align-items: stretch;
      gap: 0;
      width: min(100%, var(--board-size));
      padding: 0;
      border-bottom: var(--chrome-rule);
    }

    #current-file-desktop {
      margin-left: auto;
      align-self: center;
  display: block;
      flex: 1 1 8ch;
      min-width: 8ch;
  text-align: right;
  overflow: hidden;
  text-overflow: ellipsis;
      padding: 0 0.75rem;
      font-size: 0.8125rem;
      opacity: 0.85;
      white-space: nowrap;
    }

    .menu {
      position: relative;
  flex: 0 0 auto;
    }

    .menu-trigger {
      font: inherit;
      padding: 0.5rem 0.875rem;
      border: none;
      border-radius: 0;
      background: transparent;
      color: var(--status-fg);
      cursor: pointer;
    }

    .menu-trigger:hover,
    .menu[data-open="true"] .menu-trigger {
      background: var(--cell-bg);
    }

    .menu-panel {
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      min-width: 10rem;
      margin: 0;
      padding: 0.25rem 0;
      border: 1px solid var(--overlay-border);
      border-radius: 6px;
      background: var(--overlay-bg);
      box-shadow: var(--overlay-shadow);
    }

    .menu-panel[hidden] {
      display: none !important;
    }

    .menu-panel button {
      font: inherit;
      width: 100%;
      padding: 0.5rem 0.875rem;
      border: none;
      border-radius: 0;
      background: transparent;
      color: var(--status-fg);
      text-align: left;
      cursor: pointer;
    }

    .menu-panel button:has(.menu-shortcut) {
      display: flex;
      white-space: nowrap;
    }

    .menu-panel button .menu-shortcut {
      margin-left: auto;
      padding-left: 1.5rem;
      opacity: 0.6;
      font-weight: normal;
    }

    .menu-panel button:hover:not(:disabled) {
      background: var(--cell-bg);
    }

    .menu-panel button.selected,
    .menu-panel button[aria-checked="true"] {
      background: var(--cell-bg);
      font-weight: 600;
    }

    .menu-panel button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    /* One line high: a longer message scrolls inside the bar, and `data-more` fades the bottom edge while text is hidden. */
    #status-bar {
      width: min(100%, var(--board-size));
      height: calc(var(--status-min-height) + 2px);
      overflow-y: auto;
      overscroll-behavior: contain;
      font-size: 0.9375rem;
      line-height: 1.45;
      padding: var(--status-pad-y) 0.75rem;
      margin-top: 0.35rem;
      border: 1px solid var(--status-border);
      border-bottom: var(--chrome-rule);
      border-radius: 6px;
      background: var(--status-bg);
      color: var(--status-fg);
    }

    #play-pad {
      width: min(100%, var(--board-size));
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: var(--pad-gap);
      margin-top: var(--pad-gap);
      margin-bottom: max(var(--pad-bottom), env(safe-area-inset-bottom, 0px));
    }

    #status-bar[data-more="true"] {
      mask-image: linear-gradient(to bottom, black calc(100% - 1.1em), transparent);
    }

    /* 1rem is the floor: every label fits in a fifth of a 360px-wide screen at this size. */
    .play-pad-btn {
      font: inherit;
      font-size: 1rem;
      white-space: nowrap;
      min-width: 0;
      line-height: 1.2;
      padding: 0.45rem 0.2rem;
      border: 1px solid var(--status-border);
      border-radius: 6px;
      background: var(--cell-bg);
      color: var(--status-fg);
      touch-action: manipulation;
    }

    .play-pad-btn:disabled {
      opacity: 0.45;
    }

    .play-pad-btn[aria-pressed="true"] {
      border-color: var(--selection-ring);
      background: var(--region-tint);
      font-weight: 600;
    }

    #status-bar.error {
      color: var(--status-error);
    }

    #status-bar.generating {
      animation: status-generating-pulse 1.2s ease-in-out infinite;
    }

    @keyframes status-generating-pulse {
      50% {
        opacity: 0.55;
      }
    }

    #prompt-dialog {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.45);
      z-index: 10;
    }

    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 1rem;
      background: var(--page-bg);
      color: var(--page-fg);
      text-align: center;
    }

    #boot-splash[hidden] {
      display: none;
    }

    #boot-splash-logo {
      width: min(14rem, 62vw);
      max-height: 34dvh;
      height: auto;
      image-rendering: auto;
      object-fit: contain;
    }

    #prompt-dialog[hidden],
    #about-modal[hidden],
    #settings-modal[hidden],
    #new-difficulty-modal[hidden],
    #generating-modal[hidden] {
      display: none;
    }

    #generating-modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.45);
      z-index: 11;
    }

    .generating-dialog {
      width: min(100%, 24rem);
      padding: 1rem 1.25rem;
      border: 1px solid var(--overlay-border);
      border-radius: 8px;
      background: var(--overlay-bg);
      color: var(--status-fg);
      box-shadow: var(--overlay-shadow);
      text-align: center;
    }

    #generating-spinner {
      width: 2.5rem;
      height: 2.5rem;
      margin: 0.75rem auto 1rem;
      border: 3px solid var(--status-border);
      border-top-color: var(--status-fg);
      border-radius: 50%;
      animation: generating-spin 0.9s linear infinite;
    }

    @keyframes generating-spin {
      to {
        transform: rotate(360deg);
      }
    }

    #generating-progress-rows {
      display: none;
      text-align: left;
      font-size: 0.875rem;
      line-height: 1.45;
      margin: 0 0 1rem;
      /* Hint + up to four row lines — limits height jump as rows appear/disappear */
      min-height: calc(0.75rem * 1.45 + 4 * 0.875rem * 1.45);
    }

    #generating-spinner[hidden] {
      height: 0;
      width: 0;
      margin: 0;
      border-width: 0;
      overflow: hidden;
      animation: none;
    }

    .gen-progress-row[hidden] {
      display: none;
    }

    .gen-progress-attempt-hint {
      font-size: 0.75rem;
      color: var(--label-fg);
      margin: 0.15rem 0 0.35rem 0.15rem;
    }

    .gen-progress-attempt-hint[hidden] {
      display: none;
    }

    #generating-modal-continue:disabled,
    #generating-modal-cancel:disabled {
      opacity: 0.45;
      cursor: default;
    }

    #generating-modal-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-top: 0.75rem;
    }

    #about-modal,
    #settings-modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.45);
      z-index: 10;
    }

    #new-difficulty-modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.45);
      z-index: 10;
    }

    .new-difficulty-btn {
      display: block;
      width: 100%;
      margin: 0.25rem 0;
      font: inherit;
      padding: 0.375rem 0.875rem;
      border: 1px solid var(--status-border);
      border-radius: 6px;
      background: var(--cell-bg);
      color: var(--status-fg);
      cursor: pointer;
    }

    .prompt-dialog,
    .about-dialog {
      width: min(100%, 24rem);
      padding: 1rem 1.25rem;
      border: 1px solid var(--overlay-border);
      border-radius: 8px;
      background: var(--overlay-bg);
      color: var(--status-fg);
      box-shadow: var(--overlay-shadow);
    }

    .about-dialog {
      text-align: center;
    }

    .settings-dialog {
      width: min(100%, 28rem);
      padding: 1rem 1.25rem;
      border: 1px solid var(--overlay-border);
      border-radius: 8px;
      background: var(--overlay-bg);
      color: var(--status-fg);
      box-shadow: var(--overlay-shadow);
      text-align: left;
    }

    [role="dialog"] h2,
    [role="alertdialog"] h2 {
      margin: 0 0 0.75rem;
      font-size: 1.25rem;
      text-align: center;
    }
    /* The empty third column mirrors the icon's, so the title centres on the dialog. */
    #prompt-dialog-header {
      display: grid;
      grid-template-columns: 3.5rem 1fr 3.5rem;
      align-items: center;
      gap: 0.5rem;
      margin: 0 0 0.75rem;
    }
    #prompt-dialog-icon {
      position: relative;
      width: 3.5rem;
      height: 3.5rem;
    }
    #prompt-dialog-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    /* The badge sits on the lower right corner, clear of the gator's face. */
    #prompt-dialog-badge {
      position: absolute;
      right: 0;
      bottom: 0.1rem;
      width: 1.3rem;
      height: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 0.8rem;
      font-weight: 700;
      line-height: 1;
      color: var(--badge-fg);
      box-shadow: 0 0 0 2px var(--overlay-bg);
    }
    #prompt-dialog[data-type="error"] #prompt-dialog-badge {
      background: var(--badge-error-bg);
    }
    #prompt-dialog[data-type="information"] #prompt-dialog-badge {
      background: var(--badge-info-bg);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.95rem;
    }
    #prompt-dialog[data-type="warning"] #prompt-dialog-badge {
      width: 1.5rem;
      height: 1.35rem;
      padding-top: 0.3rem;
      box-sizing: border-box;
      border-radius: 0;
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
      box-shadow: none;
      background: var(--badge-warning-bg);
      color: var(--badge-warning-fg);
    }
    #prompt-dialog-header h2 {
      margin: 0;
      text-align: center;
    }
    #prompt-dialog-buttons .prompt-default {
      font-weight: 600;
      border-color: var(--status-fg);
    }
    #prompt-dialog-text {
      margin: 0 0 1rem;
      line-height: 1.45;
    }
    #prompt-dialog-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: stretch;
      gap: 0.5rem;
    }

    #about-artwork {
      width: 4.5rem;
      height: 4.5rem;
      object-fit: contain;
      display: block;
      margin: 0 auto 0.5rem;
    }

    #about-summary,
    #about-copyright {
      margin: 0 0 0.5rem;
      line-height: 1.45;
    }

    #about-summary {
      white-space: pre-line;
    }

    #settings-modal label {
      display: block;
      margin: 0 0 0.875rem;
      line-height: 1.45;
    }

    #settings-modal .settings-check {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      cursor: pointer;
    }

    #settings-modal .settings-field select {
      display: block;
      margin-top: 0.35rem;
      width: 100%;
      font: inherit;
      padding: 0.25rem 0.5rem;
      border: 1px solid var(--status-border);
      border-radius: 6px;
      background: var(--cell-bg);
      color: var(--status-fg);
    }

    #settings-modal-dismiss,
    #about-modal-dismiss,
    #prompt-dialog-buttons button,
    #new-difficulty-cancel,
    #generating-modal-cancel,
    #generating-modal-continue {
      font: inherit;
      padding: 0.375rem 0.875rem;
      border: 1px solid var(--status-border);
      border-radius: 6px;
      background: var(--cell-bg);
      color: var(--status-fg);
      cursor: pointer;
    }

    #settings-modal-dismiss,
    #about-modal-dismiss,
    #new-difficulty-cancel {
      display: block;
      margin: 0.5rem 0 0 auto;
    }

    .board-frame {
      display: grid;
      grid-template-columns: 1fr repeat(9, 2fr) 1fr;
      grid-template-rows: 1fr repeat(9, 2fr) 1fr;
      width: var(--board-size);
      aspect-ratio: 1;
      border: 1px solid var(--frame-border);
      background: var(--gutter-bg);
    }

    .gutter-cell,
    .label-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
      background: var(--gutter-bg);
      user-select: none;
      border: none;
    }

    .label-cell {
      color: var(--label-fg);
      font-size: clamp(0.625rem, 28cqmin, 0.875rem);
      font-weight: 600;
    }

    .board-play {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(9, 1fr);
      grid-column: 2 / 11;
      grid-row: 2 / 11;
      container-type: size;
      background: var(--board-bg);
      border: 1px solid var(--line-box);
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
      font-size: clamp(0.75rem, 45cqmin, 2rem);
      font-weight: 500;
      background: var(--cell-bg);
      color: var(--cell-fg);
      border-right: 1px solid var(--line-cell);
      border-bottom: 1px solid var(--line-cell);
      user-select: none;
    }

    .cell:nth-child(9n) {
      border-right: none;
    }

    .cell:nth-child(n + 73) {
      border-bottom: none;
    }

    .cell.box-right {
      border-right: 1px solid var(--line-box);
    }

    .cell.box-bottom {
      border-bottom: 1px solid var(--line-box);
    }

    .cell:nth-child(9n).box-right {
      border-right: none;
    }

    .cell:nth-child(n + 73).box-bottom {
      border-bottom: none;
    }

    .cell.given {
      background: var(--given-bg);
      color: var(--given-fg);
      font-weight: 600;
    }

    .cell.player {
      color: var(--player-fg);
    }

    .cell.conflict {
      color: var(--conflict-fg);
      background: var(--conflict-bg);
    }

    .cell.region:not(.conflict) {
      box-shadow: inset 0 0 0 9999px var(--region-tint);
    }

    /* A cell's marks: nine fixed slots, 1 top left to 9 bottom right. cqmin is of the 9×9 grid, so a slot
       is about 3.7cqmin; 8px is the floor for legibility on a 360dp phone. */
    .marks {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      width: 100%;
      height: 100%;
      font-size: max(8px, 3cqmin);
      font-weight: 400;
      line-height: 1;
      color: var(--player-fg);
      overflow: hidden;
    }

    .marks > span {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
    }

    .cell.selected {
      outline: 2px solid var(--selection-ring);
      outline-offset: -2px;
      z-index: 1;
    }

    .board-play:focus {
      outline: none;
    }

    /* Group-fit trigger: switch when the default menu+board+status stack can no longer
       fit at minimum board size plus default outer/shell spacing. */
    /* Phones: menu bar, full-width board, status bar and pad must fit 360x568 without the page scrolling. */
    @media (max-width: calc(26rem + 2px)) {
      :root {
        --page-inset: 0;
        --game-margin: 0;
        --board-size: 100dvw;
        --status-pad-y: 0.45rem;
        --pad-bottom: var(--pad-gap);
      }

      body {
        padding: 0;
        justify-content: flex-start;
      }

      #app {
        width: 100%;
        min-height: 100dvh;
        align-items: stretch;
        gap: 0.25rem;
      }

      #game-shell {
        width: 100%;
        flex: 1 1 auto;
        align-items: stretch;
        justify-content: flex-start;
        gap: 0.25rem;
        padding: 0;
      }

      #menu-bar {
        width: 100%;
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 9;
      }

      .menu-trigger {
        padding: 0.45rem 0.55rem;
      }


      .board-frame {
        width: 100dvw;
      }

      #status-bar {
        width: 100dvw;
        margin-top: 0;
        border-left: none;
        border-right: none;
        border-radius: 0;
      }

      #play-pad {
        margin-top: auto;
      }

    }
  </style>
</head>
<body>
  <div id="boot-splash" role="status" aria-live="polite">
    <img id="boot-splash-logo" src="/branding/splash-mark-256.png" alt="Sudoku gator mark">
  </div>
  <main id="app">

  <script>
    (function () {
      const statusBar = document.getElementById("status-bar");
      const promptDialog = document.getElementById("prompt-dialog");
      const bootSplash = document.getElementById("boot-splash");
      const isAndroidWebView =
        typeof window !== "undefined" &&
        (!!window.__SudokuAndroidBridge ||
          /\bwv\b/.test(navigator.userAgent) ||
          /Android/i.test(navigator.userAgent));
      const bootSplashShownAt =
        typeof performance !== "undefined" && typeof performance.now === "function"
          ? performance.now()
          : Date.now();
      const BOOT_SPLASH_MIN_MS = 2000;
      const WEB_BOOT_TIMEOUT_MS = 12000;
      /** Shown for any boot failure in a browser; the reason goes to the console or the client log. */
      const BOOT_FAILED_MSG = "The game could not start. Reload the page to try again.";
      /** The Android app owns its own sentence (MainActivity); a browser shows the page's. */
      const bootFailedText = () =>
        window.AndroidFileBridge ? window.AndroidFileBridge.bootFailedText() : BOOT_FAILED_MSG;
      const BOOT_FAILED_TITLE = "Error";
      const BOOT_FAILED_BADGE = "✖";
      const OK_LABEL = "OK";
      let bootSplashHidePromise = null;
      let bootFailureShown = false;
      async function hideBootSplash() {
        if (bootSplashHidePromise) return bootSplashHidePromise;
        bootSplashHidePromise = (async () => {
          if (isAndroidWebView) {
            if (bootSplash) bootSplash.hidden = true;
            return;
          }
          const now =
            typeof performance !== "undefined" && typeof performance.now === "function"
              ? performance.now()
              : Date.now();
          const remaining = Math.max(0, BOOT_SPLASH_MIN_MS - (now - bootSplashShownAt));
          if (remaining > 0) await new Promise((resolve) => setTimeout(resolve, remaining));
          if (bootSplash) bootSplash.hidden = true;
        })();
        return bootSplashHidePromise;
      }
      function showBootFailure() {
        if (bootFailureShown) return;
        bootFailureShown = true;
        void hideBootSplash();
        if (statusBar) {
          statusBar.textContent = bootFailedText();
          statusBar.className = "error";
        }
        if (promptDialog) {
          promptDialog.dataset.type = "error";
          document.getElementById("prompt-dialog-badge").textContent = BOOT_FAILED_BADGE;
          document.getElementById("prompt-dialog-title").textContent = BOOT_FAILED_TITLE;
          document.getElementById("prompt-dialog-text").textContent = bootFailedText();
          const ok = document.createElement("button");
          ok.type = "button";
          ok.textContent = OK_LABEL;
          ok.className = "prompt-default";
          ok.addEventListener("click", () => {
            promptDialog.hidden = true;
          });
          document.getElementById("prompt-dialog-buttons").replaceChildren(ok);
          promptDialog.hidden = false;
          ok.focus();
        }
      }
      // Before boot is ready an uncaught error means the game did not start; after it, app_boot logs them.
      function failBootWith(reason, source) {
        if (window.__sudokuBootReady === true) return;
        console.error("sudoku boot failed:", reason, source ?? "");
        showBootFailure();
      }
      window.addEventListener("error", (ev) =>
        failBootWith(ev.error ?? ev.message, ev.filename ? `${ev.filename}:${ev.lineno}:${ev.colno}` : ""));
      window.addEventListener("unhandledrejection", (ev) => failBootWith(ev.reason, "promise"));
      window.__sudokuSignalAndroidBootReady = function () {
        window.__sudokuBootReady = true;
        try {
          window.AndroidFileBridge?.notifyWebBootReady();
        } catch (err) {
          console.error("sudoku boot-ready signal failed:", err);
        }
      };
      // Android already shows a native launch splash; suppress the HTML splash
      // there to avoid stacked overlays.
      if (isAndroidWebView && bootSplash) bootSplash.hidden = true;
      setTimeout(() => failBootWith(`no boot after ${WEB_BOOT_TIMEOUT_MS} ms`), WEB_BOOT_TIMEOUT_MS);
      window.__hideSudokuBootSplash = hideBootSplash;
      window.__sudokuShowBootFailure = showBootFailure;
    })();
  </script>

  <script type="module">
    import * as appBoot from "../app_boot.js";

    await appBoot.bootSudokuWebApp(document);
  </script>
